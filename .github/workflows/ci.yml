name: Verify CLite
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 scripts/build-story.py --check
      - run: docker build -t clite:test .
      - run: docker run --rm --entrypoint /bin/sh -v "$PWD/tests:/app/tests:ro" clite:test -c "bun test && python3 -m unittest discover -s tests -p 'test_*.py'"
      - run: docker run --rm --entrypoint /bin/bash -v "$PWD/tests:/app/tests:ro" clite:test /app/tests/install-smoke.sh
