<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CLite Terminal</title>
    <link rel="stylesheet" href="/xterm/xterm.css">
    <link rel="stylesheet" href="/style.css?v=2">
  </head>
  <body class="terminal-page">
    <header class="topbar">
      <a class="brand" href="/">CLite</a>
      <div class="status-line">
        <span id="modeLabel">Connecting</span>
        <span id="status" class="status">Disconnected</span>
        <span id="timer">--:--</span>
      </div>
      <details id="workspaceMenu" class="workspace-menu">
        <summary>Workspace <span aria-hidden="true">⌄</span></summary>
        <nav class="terminal-actions" aria-label="Workspace actions">
        <button id="keepAlive" type="button" disabled>Keep working</button>
        <button id="uploadButton" type="button" disabled>Upload file</button>
        <button id="exportButton" type="button" disabled>Download workspace</button>
        <button id="saveTranscript" type="button">Save transcript</button>
        <button id="reconnect" type="button" hidden>Reconnect</button>
        <button id="newSession" type="button" hidden>New session</button>
        <button id="endSession" type="button" disabled>End session</button>
        <input id="uploadFile" type="file" hidden>
        </nav>
      </details>
    </header>
    <p id="sessionMessage" class="session-notice" role="status" hidden></p>
    <main id="terminal" aria-label="Interactive terminal"></main>
    <script src="/xterm/xterm.js"></script>
    <script src="/xterm/addon-fit.js"></script>
    <script src="/client.js?v=2"></script>
  </body>
</html>
