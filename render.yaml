services:
  - type: web
    name: clite
    runtime: docker
    healthCheckPath: /healthz
    envVars:
      - key: TEAM_KEY
        generateValue: true
      - key: TRUST_PROXY
        sync: false
      - key: MAX_TEAM_SESSIONS
        sync: false
      - key: TEAM_TIMEOUT_MINUTES
        sync: false
      - key: TEAM_IDLE_TIMEOUT_MINUTES
        sync: false
